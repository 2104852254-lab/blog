name: Build and Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # 两个平台分别构建：Vercel 用根路径，Pages 用 /blog/，避免只在一个网站正常。
    strategy:
      fail-fast: false
      matrix:
        target: [ vercel, github-pages ]
    runs-on: ubuntu-latest
    name: Check ${{ matrix.target }}
    env:
      DEPLOY_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: |
          pnpm check
          pnpm type-check
      - name: Build complete site
        # 运行项目完整流程，而不只运行 astro build；包含搜索索引和最终链接检查。
        run: pnpm build
      - name: Check output and interactions
        run: pnpm test
