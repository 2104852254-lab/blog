name: Deploy to GitHub Pages

on:
  push:
    # 当前只从 master 自动发布 GitHub Pages。
    branches: [ master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 构建与产物检查使用相同目标路径，只有全部通过才上传。
    env:
      DEPLOY_TARGET: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: |
          pnpm check
          pnpm type-check
      
      - name: Build site
        # GitHub Pages 不是根域名站点；构建时明确让 Astro 使用 /blog/ 路径。
        # 这个变量只在 GitHub Actions 中设置，不会影响 Vercel 的根路径构建。
        run: pnpm run build

      - name: Check output and interactions
        run: pnpm test

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
